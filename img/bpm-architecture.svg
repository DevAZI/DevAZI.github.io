<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BPM Service Architecture</title>
  <desc id="desc">Architecture diagram for the Spring Boot BPM web service.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444"/>
    </marker>
    <style>
      .bg{fill:#fff}.box{fill:#fff;stroke:#d8b46a;stroke-width:3;rx:18}.soft{fill:#fff7ed;stroke:#fed7aa;stroke-width:2;rx:14}
      .node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:12}.aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:12}
      .db{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.ai{fill:#f0fdf4;stroke:#22c55e;stroke-width:2;rx:12}
      .sec{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.text{font-family:Arial, sans-serif;fill:#1f2937}
      .title{font-size:34px;font-weight:700}.h{font-size:21px;font-weight:700}.p{font-size:15px}.small{font-size:13px;fill:#475569}
      .line{stroke:#444;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text x="62" y="65" class="text title">BPM - Service Architecture</text>
  <text x="62" y="94" class="text small">Spring Boot, JPA, JWT/OAuth2, articles, comments, file download, Unity WebGL</text>

  <rect x="55" y="170" width="185" height="98" class="node"/>
  <text x="92" y="210" class="text h">Developer</text>
  <text x="86" y="238" class="text p">Push source code</text>

  <rect x="310" y="145" width="175" height="125" class="node"/>
  <text x="360" y="185" class="text h">GitHub</text>
  <text x="344" y="215" class="text p">Repository</text>
  <text x="329" y="241" class="text small">branch / pull / merge</text>

  <rect x="560" y="132" width="210" height="154" class="aws"/>
  <text x="600" y="175" class="text h">GitHub Actions</text>
  <text x="600" y="206" class="text p">CI/CD workflow</text>
  <text x="600" y="232" class="text small">build, package, deploy</text>

  <rect x="855" y="145" width="190" height="125" class="aws"/>
  <text x="900" y="185" class="text h">AWS EC2</text>
  <text x="895" y="215" class="text p">Spring Boot runtime</text>
  <text x="908" y="241" class="text small">8080 service</text>

  <rect x="455" y="340" width="290" height="150" class="box"/>
  <text x="510" y="390" class="text title">Spring Boot</text>
  <text x="507" y="426" class="text p">REST API / Thymeleaf</text>
  <text x="505" y="454" class="text small">articles, comments, files, auth</text>

  <rect x="830" y="350" width="160" height="92" class="sec"/>
  <text x="850" y="388" class="text h">JWT/OAuth2</text>
  <text x="858" y="416" class="text p">Security filter</text>

  <rect x="840" y="492" width="175" height="95" class="ai"/>
  <text x="873" y="530" class="text h">WebGL</text>
  <text x="858" y="558" class="text p">Unity static build</text>

  <rect x="150" y="370" width="185" height="100" class="db"/>
  <text x="211" y="409" class="text h">H2</text>
  <text x="166" y="437" class="text p">JPA entities / tokens</text>

  <rect x="160" y="515" width="168" height="82" class="soft"/>
  <text x="198" y="550" class="text h">Client</text>
  <text x="177" y="576" class="text p">browser / WebGL</text>

  <line x1="240" y1="219" x2="310" y2="207" class="line"/>
  <line x1="485" y1="207" x2="560" y2="207" class="line"/>
  <line x1="770" y1="207" x2="855" y2="207" class="line"/>
  <line x1="950" y1="270" x2="748" y2="372" class="line"/>
  <line x1="455" y1="420" x2="335" y2="420" class="line"/>
  <line x1="745" y1="400" x2="830" y2="396" class="line"/>
  <line x1="930" y1="492" x2="725" y2="455" class="line dash"/>
  <line x1="328" y1="556" x2="455" y2="462" class="line"/>
  <text x="1020" y="622" class="text title">Service Architecture</text>
</svg>
